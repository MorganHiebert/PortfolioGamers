<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Gamers</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <h1>My First Game</h1>
        </header>

        <main>
            <!-- The button that triggers the sidebar -->
            <button id="open-btn">♡</button>

            <!-- The Sidebar Container -->
            <div id="sidebar" class="sidebar">
                <button id="close-btn">✕ Close</button>
                <nav class="sidebar-links">

                </nav>
            </div>

            <div>
                <a href="index.html" class="button-link">Main Page</a>
            </div>

            <div>
                <img src="Images\TillyRed.jpg" alt="game thumbnail" class="game-thumbnail">
                <a href="MyGame\Start.html" class="button-link">Play Game</a>
                <p>A choose your own adventure game that follows the story of a girl just going through the motions of a normal day.</p>
                <p>Created by Morgan Hiebert</p>
                <p>Send me a review!</p>
            </div>

            <!--button to sumbit review -->
            <button class="open-btn" onclick="toggleForm()">Review</button>

            <!--the review form-->
            <div id="myForm" class="form-container">
                <h1>Review Form</h1>
                <form target="_blank" action="https://formsubmit.co/morgantaylorh94@outlook.com" method="POST">
                    <div class="form-group">
                        <div class="form-row">
                            <div class="col">
                                <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                            </div>
                            <div class="col">
                                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Your Message" class="form-control" name="message" rows="10" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-lg btn-dark btn-block">Submit Form</button>
                </form>
            </div>


        </main>

        <script src="script.js" defer></script>
    </body>
</html>
