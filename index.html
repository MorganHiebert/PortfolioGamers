<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Gamers</title>
        <!-- Link the CSS file here -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header class="top-bar">
            <h1>Portfolio Gamers</h1>

            <!-- The button that triggers the sidebar -->
            <button id="open-btn">♡</button>

            <!-- The Sidebar Container -->
            <div id="sidebar" class="sidebar">
                <button id="close-btn">✕ Close</button>
                <nav class="sidebar-links">

                </nav>
            </div>

        </header>

        <main>

<div class="card-grid">
    <!-- card 1: My First Game -->
    <a href="Details.html" class="button-link game-card" data-id="game-1">
        <!-- Reusable favorite button inside the card -->
        <button class="fav-btn" title="Add to Favorites">♡</button>
        <img src="Images/TillyRed.jpg" alt="My First Game Preview" class="button-image">
        <span class="button-text">My First Game</span>
    </a>

    <!-- card 2: HTML Sample One -->
    <a href="HTML1.html" class="button-link game-card" data-id="game-2">
        <button class="fav-btn" title="Add to Favorites">♡</button>
        <img src="Images/sample1ref.png" alt="HTML Sample One Preview" class="button-image">
        <span class="button-text">HTML Sample One</span>
    </a>

    <!-- card 3: HTML Sample Two -->
    <a href="HTML2.html" class="button-link game-card" data-id="game-3">
        <button class="fav-btn" title="Add to Favorites">♡</button>
        <img src="Images/sample2ref.png" alt="HTML Sample Two Preview" class="button-image">
        <span class="button-text">HTML Sample Two</span>
    </a>
</div>


        </main>

        <script src="script.js" defer></script>
    </body>
</html>
