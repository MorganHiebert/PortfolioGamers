<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Gamers</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header class="top-bar">
            <h1>Portfolio Gamers</h1>

            <!-- The button that triggers the sidebar -->
            <button id="open-btn">♡</button>

            <!-- The Sidebar Container -->
            <div id="sidebar" class="sidebar">
                <button id="close-btn">✕ Close</button>
                <nav class="sidebar-links">

                </nav>
            </div>

        </header>

        <main>

            <div class="card-grid">
                <!-- Card 1: My First Game -->
                <div class="game-card-wrapper">
                    <a href="Details.html" class="button-link game-card" data-id="game-1">
                        <button class="fav-btn" title="Add to Favorites">♡</button>
                        <img src="Images/TillyRed.jpg" alt="My First Game Preview" class="button-image">
                        <span class="button-text">My First Game</span>
                    </a>
                    <!-- Interactive Rating Bar -->
                    <div class="rating-widget" data-game="game-1">
                        <div class="star-interactive">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <div class="rating-summary">Summary: Loading...</div>
                    </div>
                </div>

                <!-- Card 2: HTML Sample One -->
                <div class="game-card-wrapper">
                    <a href="HTML1.html" class="button-link game-card" data-id="game-2">
                        <button class="fav-btn" title="Add to Favorites">♡</button>
                        <img src="Images/sample1ref.png" alt="HTML Sample One Preview" class="button-image">
                        <span class="button-text">HTML Sample One</span>
                    </a>
                    <div class="rating-widget" data-game="game-2">
                        <div class="star-interactive">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <div class="rating-summary">Summary: Loading...</div>
                    </div>
                </div>

                <!-- Card 3: HTML Sample Two -->
                <div class="game-card-wrapper">
                    <a href="HTML2.html" class="button-link game-card" data-id="game-3">
                        <button class="fav-btn" title="Add to Favorites">♡</button>
                        <img src="Images/sample2ref.png" alt="HTML Sample Two Preview" class="button-image">
                        <span class="button-text">HTML Sample Two</span>
                    </a>
                    <div class="rating-widget" data-game="game-3">
                        <div class="star-interactive">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <div class="rating-summary">Summary: Loading...</div>
                    </div>
                </div>
            </div>

            <!-- guestbook! -->
            <section class="guestbook-container">
                <h2>Gamer Guestbook</h2>
                
                <!-- guestbook form -->
                <form id="guestbook-form">
                    <div class="form-group">
                        <label for="username">Gamer Tag / Name:</label>
                        <input type="text" id="username" required placeholder="e.g., NoobMaster99">
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" required placeholder="Leave a comment about the games..."></textarea>
                    </div>
                    <button type="submit" id="submit-entry-btn">Sign Guestbook</button>
                </form>

                <!-- container where AJAX will load external comments -->
                <div id="guestbook-entries">
                    <p class="loading-msg">Loading entries from the server...</p>
                </div>
            </section>

        </main>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script src="script.js" defer></script>
    </body>
</html>
